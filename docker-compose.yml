version: '3.8'

services:
  llm-router:
    image: ghcr.io/icewheel-oss/llm-cluster-router:latest
    container_name: llm-cluster-router-standalone
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - CONFIG_PATH=config.yaml
      - PYTHONUNBUFFERED=1
