# Reference Logstash pipeline for llm-cluster-router's audit log stream.
#
# The router writes one JSON line per completed request (see README.md's
# "Observability & Auditing" section for the full field list) to stdout,
# tagged "AUDIT_LOG: {...}". Set LOGSTASH_HOST/LOGSTASH_PORT on the router
# to also push that same JSON line directly over TCP to this pipeline's
# `tcp` input (this is optional — the router works fine with zero log
# shipper configured, stdout/`docker logs` always gets the same content).
#
# This is a MINIMAL starting point, not a production-hardened pipeline —
# adjust retention, security (TLS on the tcp input, real ES auth), and the
# index naming/rollover policy for your own environment.

input {
  tcp {
    port  => 5044
    codec => json_lines
  }
}

filter {
  # Optional: drop noisy polling traffic before it reaches Elasticsearch.
  # GET /v1/models and GET /health aren't proxied through the audit-log
  # path today, so this only matters if you're also shipping the
  # container's plain stdout (e.g. via Filebeat) alongside the TCP feed.
  if [message] =~ /GET \/v1\/models/ or [message] =~ /GET \/health/ {
    drop { }
  }
}

output {
  elasticsearch {
    hosts               => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
    index                => "llm-audit-logs-%{+YYYY.MM.dd}"
    user                 => "${ELASTICSEARCH_USER:elastic}"
    password             => "${ELASTICSEARCH_PASSWORD}"
    ecs_compatibility    => disabled
  }

  # Comment this out once you've confirmed events are landing in Elasticsearch.
  stdout { codec => rubydebug }
}
