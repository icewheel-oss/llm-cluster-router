# Reference stack: llm-cluster-router + Elasticsearch + Logstash + Kibana.
#
# This is a starting point for the "📊 Observability & Auditing" and
# "🔍 Kibana Query Reference" sections of the main README — it is NOT meant
# to be run as-is in production (single-node ES, no TLS, a throwaway
# password below). Copy it next to your own config.yaml, adjust as needed:
#
#   cp observability/docker-compose.elk.example.yml docker-compose.elk.yml
#   docker compose -f docker-compose.yml -f docker-compose.elk.yml up -d
#
# Metrics (Prometheus) are a separate, independent path — see
# observability/prometheus.example.yaml. You can run either of these two
# observability paths on their own, or both together.

services:
  llm-router:
    environment:
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5044
    depends_on:
      - logstash

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.1
    container_name: llm-router-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"

  logstash:
    image: docker.elastic.co/logstash/logstash:9.4.1
    container_name: llm-router-logstash
    restart: unless-stopped
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USER=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD:-changeme}
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "5044:5044"
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.1
    container_name: llm-router-kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD:-changeme}
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

volumes:
  esdata:
